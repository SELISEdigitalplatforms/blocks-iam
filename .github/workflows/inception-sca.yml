name: Reusable - Inception SCA

on:
  workflow_call:
    inputs:
      DT_URL:
        description: "Dependency-Track portal (nginx proxies /api to the API server)"
        required: false
        type: string
        default: "https://sca.blocksdevelopers.com"
      PROJECT_NAME:
        required: false
        type: string
        default: "blocks-iam"
      PROJECT_VERSION:
        required: false
        type: string
        default: "inception"
      SPEC_VERSION:
        description: "CycloneDX spec version Dependency-Track accepts"
        required: false
        type: string
        default: "1.6"
      SEVERITY_FAIL:
        description: "Fail the job on Trivy findings at/above this severity (empty = report only)"
        required: false
        type: string
        default: ""

    secrets:
      INCEPTION_DT_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  sca:
    name: Trivy SBOM -> Dependency-Track
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Trivy
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq trivy
          trivy --version

      - name: Generate CycloneDX SBOM (server + client)
        env:
          INPUTS_SPEC_VERSION: ${{ inputs.SPEC_VERSION }}
        run: |
          set -euo pipefail
          trivy fs --quiet --format cyclonedx --output sbom.cdx.json .
          # Dependency-Track rejects spec versions it does not know yet.
          # Use python (not single-quoted sed) so INPUTS_SPEC_VERSION expands.
          python3 -c "import json,os;d=json.load(open('sbom.cdx.json'));d['specVersion']=os.environ['INPUTS_SPEC_VERSION'];json.dump(d,open('sbom.upload.json','w'));print('components:',len(d.get('components',[])),'specVersion:',d['specVersion'])"

      - name: Upload SBOM to SCA portal
        env:
          DT_API_KEY: ${{ secrets.INCEPTION_DT_API_KEY }}
          INPUTS_DT_URL: ${{ inputs.DT_URL }}
          INPUTS_PROJECT_NAME: ${{ inputs.PROJECT_NAME }}
          INPUTS_PROJECT_VERSION: ${{ inputs.PROJECT_VERSION }}
        run: |
          set -euo pipefail
          [ -n "${DT_API_KEY:-}" ] || { echo "::error::secret DT_API_KEY is not set"; exit 1; }
          code=$(curl -sS -o /tmp/dt.out -w '%{http_code}' \
            -X POST "${INPUTS_DT_URL}/api/v1/bom" \
            -H "X-Api-Key: $DT_API_KEY" \
            -F autoCreate=true \
            -F projectName="${INPUTS_PROJECT_NAME}" \
            -F projectVersion="${INPUTS_PROJECT_VERSION}" \
            -F "bom=@sbom.upload.json")
          echo "HTTP $code"
          case "$code" in
            2*) echo "SBOM published: ${INPUTS_DT_URL}" ;;
            *)  echo "::error::SBOM upload failed (HTTP $code)"; head -c 500 /tmp/dt.out; exit 1 ;;
          esac

      - name: Vulnerability report
        env:
          INPUTS_SEVERITY_FAIL: ${{ inputs.SEVERITY_FAIL }}
        run: |
          set -euo pipefail
          sev="${INPUTS_SEVERITY_FAIL}"
          if [ -n "$sev" ]; then
            trivy fs --quiet --scanners vuln --severity "$sev" --exit-code 1 .
          else
            trivy fs --quiet --scanners vuln --severity HIGH,CRITICAL .
          fi

      - name: Clean up SBOM files
        if: always()
        run: rm -f sbom.cdx.json sbom.upload.json
